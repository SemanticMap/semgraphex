name: nSBM Huffman exact grammar smoke
on:
  pull_request:
  push:
    branches: [feature/nsbm-huffman-grammar-cn10k]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev,notebook]"
      - run: python -m pytest -q tests/test_grammar_huffman.py tests/test_nsbm_huffman_experiment.py tests/test_nsbm_checkpoint_independence.py tests/test_nsbm_recursive_codec.py tests/test_nsbm_shape_identity.py tests/test_nsbm_shared_hierarchy.py tests/test_nsbm_measured_selection.py tests/test_nsbm_fit_checkpoint.py tests/test_h1_runner.py tests/test_grammar_codec_v2.py
      - run: python -m pytest -q tests/test_nsbm_colab_cuda_bootstrap.py
      - name: Notebook format and Python cell syntax
        run: |
          python - <<'PY'
          import ast, nbformat
          nb = nbformat.read('notebooks/20_nsbm_huffman_grammar_cn10k_cn100k_colab.ipynb', as_version=4)
          nbformat.validate(nb)
          for i, cell in enumerate(nb.cells):
              if cell.cell_type == 'code':
                  ast.parse(cell.source, filename=f'cell-{i}')
          print('Notebook validated:', len(nb.cells), 'cells')
          PY
