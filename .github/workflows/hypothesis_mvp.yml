name: Hypothesis MVP
on:
  push:
    branches: [feature/hypothesis-mvp-parallel-gpu]
  pull_request:
    paths:
      - 'src/semmap_haken/hypothesis/**'
      - 'tests/test_hypothesis_mvp.py'
      - 'pyproject.toml'
      - '.github/workflows/hypothesis_mvp.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_hypothesis_mvp.py
      - run: >-
          python -m semmap_haken.hypothesis.cli pilot
          --input tests/fixtures/conceptnet_tiny.tsv
          --output /tmp/semmap-hypothesis-smoke
          --nulls 2 --workers 2 --device cpu
