name: Hypothesis MVP
on:
  push:
    branches: [feature/hypothesis-mvp-parallel-gpu, feature/h1-cn10k-relation-aware-validation]
  pull_request:
    paths:
      - 'src/semmap_haken/hypothesis/**'
      - 'tests/test_hypothesis_mvp.py'
      - 'tests/test_h1_science.py'
      - 'tests/test_h1_runner.py'
      - 'tests/test_h1_colab_notebook.py'
      - 'tests/test_h1_cn10k_relations.py'
      - 'tests/test_h1_cn10k_notebook.py'
      - 'notebooks/19_h1_conceptnet_10k_relations_colab.ipynb'
      - 'src/semmap_haken/hypothesis/conceptnet_10k.py'
      - 'src/semmap_haken/hypothesis/hierarchy_validation.py'
      - 'notebooks/18_h1_nsbm_nulls_l4_12cpu_colab.ipynb'
      - 'tests/test_h1_graph_tool_integration.py'
      - 'pyproject.toml'
      - '.github/workflows/hypothesis_mvp.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]' nbformat
      - run: python -m pytest -q tests/test_hypothesis_mvp.py tests/test_h1_science.py tests/test_h1_runner.py tests/test_h1_colab_notebook.py tests/test_h1_cn10k_relations.py tests/test_h1_cn10k_notebook.py
      - run: >-
          python -m semmap_haken.hypothesis.cli pilot
          --input tests/fixtures/conceptnet_tiny.tsv
          --output /tmp/semmap-hypothesis-smoke
          --nulls 2 --workers 2 --device cpu

  graph-tool-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install system graph-tool (Ubuntu Python 3.12)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-graph-tool python3-pytest python3-scipy python3-numpy python3-sklearn python3-networkx python3-yaml
      - name: Ensure graph-tool really imports
        run: /usr/bin/python3 -c "import graph_tool.all as gt; print(gt.__version__)"
      - name: Scientific graph-tool integration
        env:
          PYTHONPATH: "src:."
          OMP_NUM_THREADS: "2"
          OPENBLAS_NUM_THREADS: "1"
        run: /usr/bin/python3 -m pytest -q tests/test_h1_graph_tool_integration.py
      - name: Synthetic calibration CLI smoke (not a statistical power claim)
        env:
          PYTHONPATH: "src:."
          OMP_NUM_THREADS: "2"
          OPENBLAS_NUM_THREADS: "1"
        run: |
          /usr/bin/python3 scripts/calibrate_h1_synthetic.py --output /tmp/h1-calibration-smoke --simulations 1 --restarts 1 --nulls 0 --per-group 8 --workers 1
          /usr/bin/python3 -c "import json; p=json.load(open('/tmp/h1-calibration-smoke/calibration.json')); assert len(p['runs']) == 2"
