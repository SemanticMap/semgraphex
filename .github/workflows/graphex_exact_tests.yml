name: Graphex Exact v1 codec tests

on:
  pull_request:
    paths:
      - 'src/semmap_haken/graphex_*.py'
      - 'tests/test_graphex_exact_codec.py'
      - '.github/workflows/graphex_exact_tests.yml'
  workflow_dispatch:

jobs:
  exact-codec:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Wishart test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c requirements/constraints.txt -e '.[dev,wishart]'
      - name: Check real lossless codec behavior
        run: pytest -q tests/test_graphex_exact_codec.py
