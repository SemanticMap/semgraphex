name: FGW 100k notebook and CPU transport smoke

on:
  pull_request:
    paths:
      - 'src/semmap_haken/wishart_fgw_accel.py'
      - 'src/semmap_haken/wishart_metrics.py'
      - 'src/semmap_haken/wishart_config.py'
      - 'src/semmap_haken/wishart_hierarchy.py'
      - 'src/semmap_haken/wishart_colab_cli.py'
      - 'src/semmap_haken/config.py'
      - 'src/semmap_haken/graph_build.py'
      - 'configs/wishart_conceptnet_fgw_100k_cuda_colab.yaml'
      - 'notebooks/09_wishart_fgw_100k_gpu_colab.ipynb'
      - 'tests/test_semmap_haken_fgw_100k_gpu.py'
  workflow_dispatch:

jobs:
  fgw-cpu-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python package and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -c requirements/constraints.txt -e '.[dev,wishart,notebook]'
      - name: Syntax and notebook checks
        run: |
          python -m compileall -q src/semmap_haken
          python - <<'PY'
          import json
          import nbformat
          from pathlib import Path

          p = Path("notebooks/09_wishart_fgw_100k_gpu_colab.ipynb")
          nb = nbformat.read(p, as_version=4)
          nbformat.validate(nb)
          for i, cell in enumerate(nb.cells):
              if cell.cell_type == "code":
                  compile(cell.source, f"{p}:cell{i}", "exec")
          assert len(nb.cells) >= 10
          print(f"Notebook validation OK: {len(nb.cells)} cells")
          PY
      - name: FGW CPU regression
        run: |
          pytest -q tests/test_semmap_haken_fgw_colab.py tests/test_semmap_haken_fgw_100k_gpu.py
