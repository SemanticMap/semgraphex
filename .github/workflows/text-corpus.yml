name: Text corpus ConceptNet Local
on:
  push:
    branches: [feature/text-corpus-conceptnet-local, feature/text-corpus-colab-drive-resume, feature/text-multiscale-research-p0, feature/text-multiscale-research-p1-h1]
  pull_request:
    paths:
      - 'src/semmap_haken/text_*.py'
      - 'src/semmap_haken/hypothesis/runner.py'
      - 'src/semmap_haken/hypothesis/splits.py'
      - 'tests/test_text_corpus*.py'
      - 'tests/test_text_colab.py'
      - 'tests/test_text_hf.py'
      - 'tests/test_text_spacy_chunks.py'
      - 'tests/test_text_chunk_graph.py'
      - 'tests/test_text_research.py'
      - 'notebooks/10_text_corpus_conceptnet_local_drive.ipynb'
      - 'notebooks/11_text_corpus_hf55_colab_clean.ipynb'
      - 'pyproject.toml'
      - '.github/workflows/text-corpus.yml'
permissions:
  contents: read
concurrency:
  group: text-corpus-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[text,dev]'
      - run: python -m nltk.downloader stopwords
      - name: Verify real optional dependencies (no skipped integration suite)
        run: python -c 'import conceptnet_local, duckdb'
      - run: python -m json.tool notebooks/10_text_corpus_conceptnet_local_drive.ipynb > /dev/null
      - run: python -m json.tool notebooks/11_text_corpus_hf55_colab_clean.ipynb > /dev/null
      - run: python -m compileall -q src/semmap_haken/text_conceptnet.py src/semmap_haken/text_hf.py src/semmap_haken/text_corpus.py src/semmap_haken/text_colab.py src/semmap_haken/text_research.py src/semmap_haken/text_research_adapter.py src/semmap_haken/text_h1.py src/semmap_haken/hypothesis/runner.py src/semmap_haken/hypothesis/splits.py
      - run: python -m pytest -q tests/test_text_corpus_words.py tests/test_text_corpus.py tests/test_text_colab.py tests/test_text_hf.py tests/test_text_spacy_chunks.py tests/test_text_chunk_graph.py tests/test_text_research.py tests/test_h1_runner.py tests/test_h1_science.py
