[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semmap-haken"
version = "0.1.0"
description = "Sparse, reproducible Haken-coarsening research foundation for ConceptNet"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SemanticMap" }]
keywords = ["ConceptNet", "graphs", "spectral dynamics", "research"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.24,<2.0",
    "scipy>=1.10,<1.14",
    "scikit-learn>=1.3",
    "PyYAML>=6.0",
    "networkx>=3.1",
]

[project.optional-dependencies]
cuda = ["cupy-cuda12x>=13,<15"]
legacy = [
    "spacy>=3.7",
    "nltk>=3.8",
    "gensim>=4.3",
    "faiss-cpu>=1.7.4",
    "annoy>=1.17.3",
    "joblib>=1.3",
]
dev = ["pytest>=7.4"]
wishart = [
    "POT>=0.9.4,<0.10",
]
notebook = [
    "nbformat>=5.9",
    "nbclient>=0.8",
    "ipykernel>=6.29",
    "matplotlib>=3.7,<3.9",
]

[project.scripts]
semmap-haken = "semmap_haken.cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["semmap_haken*", "semgraphex*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
