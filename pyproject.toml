[project]
name = "semgraphex"
version = "0.1.0"
authors = [ { name = "SemanticMap" } ]
description = "Graphon-based semantic concept extraction and search"
requires-python = ">=3.9"
readme = "README.md"
license = { text = "MIT" }
keywords = ["graphon","graph","NLP","semantic search","concept extraction"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]


dependencies = [

"spacy >=3.7.0",
"nltk >=3.8.0",
"gensim >=4.3.0",
"scikit-learn >=1.3.0",
"networkx >=3.1",
"numpy >=2.3.2",
"scipy >=1.11.0",
"faiss-cpu >=1.7.4", # if installation fails on some systems, user can switch to annoy
"annoy >=1.17.3",
"joblib >=1.3.0"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
