paths:
  workspace_root: ..
  data_root: data
  cache_root: data/cache
  runs_root: runs
dataset:
  source: conceptnet-5.7
  version: "5.7.0"
  source_url: https://conceptnet.s3.amazonaws.com/downloads/2019/edges/conceptnet-assertions-5.7.0.csv.gz
  # Required for verified official runs; replace with the official pinned digest.
  expected_sha256: null
  # Override this in a copied config for offline smoke tests/manual uploads.
  path: null
  language: en
  relations: [RelatedTo, IsA]
  min_weight: 1.0
  max_nodes: 1000
  component: largest
graph:
  directed: false
  self_loop_policy: exclude
  weight_transform: log1p
  operator: normalized_adjacency
runtime:
  profile: smoke
  random_seed: 1729
  resource_profile: resource_profiles/smoke.yaml
