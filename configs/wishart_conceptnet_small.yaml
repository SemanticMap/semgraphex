paths:
  workspace_root: ..
  data_root: data
  cache_root: data/cache
  runs_root: tmp/runs

dataset:
  source: conceptnet-5.7
  # Point this at an already-downloaded ConceptNet assertions TSV/CSV.
  path: ../data/conceptnet_en_100k.tsv
  language: en
  relations:
    - RelatedTo
    - IsA
    - PartOf
    - HasA
    - UsedFor
    - HasProperty
    - CapableOf
    - Causes
  min_weight: 1.0
  max_nodes: 10000
  component: largest

graph:
  directed: false
  self_loop_policy: exclude
  weight_transform: log1p
  operator: normalized_adjacency

runtime:
  profile: wishart-small
  random_seed: 1729

execution:
  backend: cpu
  dtype: float64
  deterministic: true

# Required by the shared ExperimentConfig contract; the Wishart runner does
# not use these Haken dynamics parameters.
dynamics:
  model: linear
  alpha: 1.0
  beta: auto_critical
  auto_critical_margin: 0.05
  time_start: 0.0
  time_stop: 5.0
  time_steps: 21
  perturbations_per_kind: 1
  perturbation_amplitude: 1.0
  perturbation_seed: 1729
  random_sparse_fraction: 0.1
  storage_policy: none
  max_storage_mb: 32

spectral:
  prepared_graph_dir: null
  top_k: 16
  max_r: 8
  tolerance: 1.0e-10
  maxiter: null
  symmetry_tolerance: 1.0e-10

wishart:
  # typed_wl | graphlet | lowrank_gw | fgw | relation_js
  metric: typed_wl

  # Candidate figure = radius-r ego subgraph around a center.
  radius: 1
  max_ego_nodes: 48
  candidate_limit: 2000

  # Wishart k-NN mode analysis.
  k_neighbors: 12
  significance: 0.7
  min_cluster_size: 3

  # Each accepted occurrence is contracted separately. Structurally similar
  # occurrences at distant graph locations are never merged into one supernode.
  min_figure_nodes: 2
  max_figures_per_level: 1000
  max_levels: 6
  min_graph_nodes: 50
  aggregation: sum
  random_seed: 1729

  # Typed WL.
  wl_iterations: 2
  feature_dim: 512

  # Pre-sampled typed graphlets.
  graphlet_size: 3
  graphlet_samples: 256

  # GW/FGW: POT is optional; install .[wishart].
  transport_rank: 24
  transport_max_candidates: 256
  fgw_alpha: 0.5

  # Dynamical diagnostics saved at every scale.
  slow_modes: 8
  mfpt_pairs: 24
  mfpt_walks_per_pair: 8
  mfpt_max_steps: 500
  betweenness_samples: 64
  clustering_samples: 256
  distance_samples: 128
