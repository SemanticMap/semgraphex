paths:
  workspace_root: ..
  data_root: data
  cache_root: data/cache
  runs_root: tmp/runs
dataset:
  source: conceptnet-5.7
  language: en
  relations: []
  min_weight: 1.0
  max_nodes: 1000
  component: largest
graph:
  directed: false
  self_loop_policy: exclude
  weight_transform: log1p
  operator: normalized_adjacency
runtime:
  profile: smoke
  random_seed: 1729
execution:
  # M2 evidence runs on the trusted strict CPU float64 reference path.
  backend: cpu
  device: 0
  dtype: float64
  workers: 1
  reserved_cpu_cores: 1
  threads_per_worker: 1
  batch_size: auto
  deterministic: true
  allow_auto_fallback: true
dynamics:
  model: linear
  alpha: 1.0
  beta: auto_critical
  auto_critical_margin: 0.05
  time_start: 0.0
  time_stop: 5.0
  time_steps: 21
  perturbations_per_kind: 1
  perturbation_amplitude: 1.0
  perturbation_seed: 1729
  random_sparse_fraction: 0.1
  storage_policy: all
  max_storage_mb: 32
spectral:
  # Set to the completed M0 prepare-* artifact directory before running M2.
  prepared_graph_dir: ../tmp/runs/prepare-smoke
  top_k: 16
  max_r: 8
  tolerance: 1.0e-10
  maxiter: null
  symmetry_tolerance: 1.0e-10
coarsening:
  enabled: true
  methods: [connectivity_matching, unconstrained_matching]
  target_reduction: 0.4
  embedding_weighting: none
  seed: 1729
  tie_breaking: distance_then_node_index
  aggregation: sum
  distance_threshold: null
