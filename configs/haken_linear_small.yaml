paths:
  workspace_root: ..
  data_root: data
  cache_root: data/cache
  runs_root: tmp/runs
dataset:
  source: conceptnet-5.7
  language: en
  relations: [RelatedTo, IsA, PartOf, HasA, UsedFor, HasProperty]
  min_weight: 1.0
  max_nodes: 10000
  component: largest
graph:
  directed: false
  self_loop_policy: exclude
  weight_transform: log1p
  operator: normalized_adjacency
runtime:
  profile: small
  random_seed: 1729
execution:
  backend: auto
  device: 0
  dtype: float64
  workers: auto
  reserved_cpu_cores: 1
  threads_per_worker: 1
  gpu_memory_fraction: 0.80
  batch_size: auto
  deterministic: true
  allow_auto_fallback: true
dynamics:
  model: linear
  alpha: 1.0
  beta: auto_critical
  auto_critical_margin: 0.05
  time_start: 0.0
  time_stop: 10.0
  time_steps: 101
  perturbations_per_kind: 2
  perturbation_amplitude: 1.0
  perturbation_seed: 1729
  random_sparse_fraction: 0.01
  storage_policy: summaries
  max_storage_mb: 256
spectral:
  prepared_graph_dir: ../tmp/runs/prepare-small/graph
  top_k: 64
  max_r: 32
  tolerance: 1.0e-10
  maxiter: null
  symmetry_tolerance: 1.0e-10
