paths:
  workspace_root: ..
  data_root: data
  cache_root: data/cache
  runs_root: tmp/runs
dataset:
  source: conceptnet-5.7
  version: "5.7.0"
  source_url: https://conceptnet.s3.amazonaws.com/downloads/2019/edges/conceptnet-assertions-5.7.0.csv.gz
  path: ../conceptnet-assertions-5.7.0.csv
  max_rows: null
  language: en
  relations: [RelatedTo, IsA, PartOf, HasA, UsedFor, HasProperty]
  min_weight: 1.0
  max_nodes: 10000
  component: largest
graph:
  directed: false
  self_loop_policy: exclude
  weight_transform: log1p
  operator: normalized_adjacency
runtime:
  profile: small
  random_seed: 1729
  resource_profile: resource_profiles/small.yaml
